name: Deploy Vodafone Catalog
run-name: Publish catalog (${{ github.ref_name }})
on:
  push:
    branches: [main]
    paths:
      - "vodafone-egypt-catalog/**"
      - ".github/workflows/vodafone-catalog-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "vodafone-catalog-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "vodafone-egypt-catalog"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
