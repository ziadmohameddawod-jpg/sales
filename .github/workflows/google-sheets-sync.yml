name: Google Sheets product sync

on:
  schedule:
    - cron: "13 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-data-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and validate the published Google Sheet
        working-directory: ./vodafone-egypt-catalog
        run: node scripts/sync-google-sheet.mjs

      - name: Collect verified daily Vodafone price observations
        working-directory: ./vodafone-egypt-catalog
        run: node scripts/collect-daily-price-history.mjs

      - name: Validate the complete catalogue
        working-directory: ./vodafone-egypt-catalog
        run: node scripts/validate-data.mjs

      - name: Commit changed product data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vodafone-egypt-catalog/data/products.json vodafone-egypt-catalog/data/price-history.json
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "Sync product catalogue from Google Sheets"
            git push origin HEAD:main
          fi
