name: Verified Vodafone product image enrichment

on:
  push:
    branches: ["main"]
    paths:
      - "vodafone-egypt-catalog/scripts/extract-vodafone-images.mjs"
      - ".github/workflows/verified-image-enrichment.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-data-updates
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check enrichment script
        working-directory: ./vodafone-egypt-catalog
        run: node --check scripts/extract-vodafone-images.mjs
      - name: Enrich only exact official product matches
        working-directory: ./vodafone-egypt-catalog
        env:
          IMAGE_PROBE_LIMIT: "160"
        run: node scripts/extract-vodafone-images.mjs --apply
      - name: Validate catalogue
        working-directory: ./vodafone-egypt-catalog
        run: node scripts/validate-data.mjs
      - name: Commit verified image updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vodafone-egypt-catalog/data/products.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No verified new product images."
          else
            git commit -m "Add verified Vodafone product images"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: enrich
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./vodafone-egypt-catalog
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
