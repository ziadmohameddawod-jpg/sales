name: Catalog data validation

on:
  pull_request:
    paths:
      - "vodafone-egypt-catalog/**"
      - ".github/workflows/**"
  push:
    branches: ["main"]
    paths:
      - "vodafone-egypt-catalog/**"
      - ".github/workflows/data-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        working-directory: ./vodafone-egypt-catalog
        run: |
          node --check app.js
          node --check analytics.js
          node --check scripts/sync-prices.mjs
          node --check scripts/validate-data.mjs
          node --check scripts/extract-vodafone-images.mjs
          node --check scripts/check-inline-scripts.mjs
          node scripts/check-inline-scripts.mjs

      - name: Probe official Vodafone product image metadata
        working-directory: ./vodafone-egypt-catalog
        env:
          IMAGE_PROBE_LIMIT: "160"
        run: node scripts/extract-vodafone-images.mjs --probe

      - name: Run sync self-tests
        working-directory: ./vodafone-egypt-catalog
        run: node scripts/sync-prices.mjs --self-test

      - name: Validate the published Google Sheets feed (read-only)
        working-directory: ./vodafone-egypt-catalog
        run: node scripts/sync-google-sheet.mjs --dry-run

      - name: Validate catalogue data
        working-directory: ./vodafone-egypt-catalog
        run: node scripts/validate-data.mjs
